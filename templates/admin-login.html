<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — MJ DEVELOPER</title>
<link rel="icon" href="/static/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<a href="/" class="brand" style="position:absolute;top:24px;left:24px;z-index:2;"><img src="/static/logo.svg" class="brand-logo" alt=""> MJ DEVELOPER</a>

<div class="auth-shell">
  <div class="hero-grid" aria-hidden="true" style="opacity:.35;"></div>
  <div class="auth-card">
    <span class="eyebrow mono">Restricted Access</span>
    <h2 style="margin-top:14px;">Admin sign in</h2>
    <p style="margin-bottom:24px;">This login is separate from customer accounts.</p>

    <form id="admin-login-form">
      <div class="field">
        <label for="admin-email">Admin email</label>
        <input type="email" id="admin-email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="admin-password">Password</label>
        <input type="password" id="admin-password" autocomplete="current-password" required>
      </div>
      <div class="form-error" id="admin-login-error"></div>
      <button type="submit" class="btn btn-primary btn-block magnetic" style="margin-top:6px;">Sign in</button>
    </form>
  </div>
</div>

<script src="/static/app.js"></script>
<script>
document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('admin-login-error');
  errEl.classList.remove('show');
  const email = document.getElementById('admin-email').value.trim();
  const password = document.getElementById('admin-password').value;
  try{
    const res = await fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.ok){
      window.location.href = data.redirect || '/admin/dashboard';
    } else {
      errEl.textContent = data.message || 'Invalid credentials.';
      errEl.classList.add('show');
    }
  } catch (err){
    errEl.textContent = 'Something went wrong. Try again.';
    errEl.classList.add('show');
  }
});
</script>
</body>
</html>
